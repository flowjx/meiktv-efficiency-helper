<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>魅KTV效率助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <strong>魅KTV效率助手</strong>
  </header>

  <section class="versions">
    <div>当前版本 <b id="current">-</b></div>
    <div>最新版本 <b id="latest">-</b></div>
  </section>

  <div id="state" class="state">检查中…</div>

  <section id="update" class="update" hidden>
    <div id="notes-title" class="notes-title"></div>
    <ul id="notes"></ul>
    <div id="auto-note" class="auto-note" hidden></div>
    <button id="reload-now" type="button" class="primary" hidden>新版本已下载，立即重新加载插件</button>
    <div id="manual">
    <ol class="steps">
      <li><a class="download" href="#" target="_blank">下载最新压缩包</a>（公司内网），解压后把里面的文件<b>覆盖</b>到原插件目录。</li>
      <li>点下面的“重新加载插件”，再刷新业务页面。</li>
    </ol>
    <button id="reload" type="button" class="primary">我已替换文件，重新加载插件</button>
    </div>
  </section>

  <div id="auto-update" class="auto-update"></div>

  <details id="au-guide" class="au-guide" hidden>
    <summary>按照如下步骤开启自动更新</summary>
    <ol class="steps">
      <li>打开插件目录 <a href="#" id="open-details">不知道在哪？</a></li>
      <li>双击 “安装自动更新.bat” 文件</li>
    </ol>
  </details>

  <footer>
    <button id="check" type="button">立即检查</button>
    <span id="checked-at"></span>
  </footer>

  <script src="update-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
